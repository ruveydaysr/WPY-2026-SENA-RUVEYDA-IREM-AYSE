<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servis Detayı | Bilgisayar Teknik Servis</title>
    <link rel="stylesheet" href="teknisyen-style.css">
</head>

<body>

    <div class="servis-detay">

        <h1>Servis Detayı</h1>
        <a href="teknisyen-panel.html" class="geri-butonu">
    ← Teknisyen Paneline Dön
</a>

        <div class="cihaz-bilgileri">
            <h2>Cihaz Bilgileri</h2>

            <p><strong>Servis No:</strong> SRV-001</p>
            <p><strong>Müşteri:</strong> Ahmet Yılmaz</p>
            <p><strong>Cihaz:</strong> Lenovo Laptop</p>
            <p><strong>Şikayet:</strong> Bilgisayar açılmıyor.</p>
        </div>

        <form>

            <label for="ariza">Arıza Tespiti</label>
            <textarea id="ariza" rows="4"
                placeholder="Tespit edilen arızayı yazınız"></textarea>

            <label for="islem">Yapılan İşlem</label>
            <textarea id="islem" rows="4"
                placeholder="Yapılan işlemleri yazınız"></textarea>

            <label for="parca">Kullanılan Parça</label>
            <input type="text" id="parca"
                placeholder="Kullanılan parçayı yazınız">

            <label for="parca-ucreti">Parça Ücreti</label>
            <input type="number" id="parca-ucreti"
                placeholder="0">

            <label for="iscilik">İşçilik Ücreti</label>
            <input type="number" id="iscilik"
                placeholder="0">
                <label for="toplam-ucret">Toplam Ücret</label>
<input type="text" id="toplam-ucret"
    value="0,00 TL" readonly>

            <label for="durum">Servis Durumu</label>

            <select id="durum">
                <option>Bekliyor</option>
                <option>İnceleniyor</option>
                <option>Parça Bekliyor</option>
                <option>Onarım Yapılıyor</option>
                <option>Tamamlandı</option>
            </select>
            <p id="durum-gostergesi">Mevcut Durum: Bekliyor</p>
            <button type="submit">Servisi Güncelle</button>

        </form>

    </div>





<script>

    const durumSecimi = document.getElementById("durum");
const durumGostergesi = document.getElementById("durum-gostergesi");

function durumGuncelle() {
    const secilenDurum = durumSecimi.value;

    const durumRenkleri = {
        "Bekliyor": "durum-bekliyor",
        "İnceleniyor": "durum-inceleniyor",
        "Parça Bekliyor": "durum-parca",
        "Onarım Yapılıyor": "durum-onarim",
        "Tamamlandı": "durum-tamamlandi"
    };

    durumGostergesi.className = durumRenkleri[secilenDurum] || "";
    durumGostergesi.textContent = "Mevcut Durum: " + secilenDurum;
}

durumSecimi.addEventListener("change", durumGuncelle);
durumGuncelle();
    const parcaUcreti = document.getElementById("parca-ucreti");
    const iscilikUcreti = document.getElementById("iscilik");
    const toplamUcret = document.getElementById("toplam-ucret");

    function toplamHesapla() {
        const parca = Number(parcaUcreti.value) || 0;
        const iscilik = Number(iscilikUcreti.value) || 0;

        const toplam = parca + iscilik;

        toplamUcret.value = toplam.toLocaleString("tr-TR", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        }) + " TL";
    }

    parcaUcreti.addEventListener("input", toplamHesapla);
    iscilikUcreti.addEventListener("input", toplamHesapla);
</script>




</body>
</html>
